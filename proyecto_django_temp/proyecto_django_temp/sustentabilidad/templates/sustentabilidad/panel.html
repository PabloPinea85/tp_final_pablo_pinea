<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Auditoría de Sostenibilidad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .total {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Panel de Auditoría de Sostenibilidad</h1>

    <h2>Registro de Consumo por Planta</h2>
    <table>
        <thead>
            <tr>
                <th>Planta</th>
                <th>Consumo (kWh)</th>
            </tr>
        </thead>
        <tbody>
            {% for registro in registros %}
            <tr>
                <td>{{ registro.planta }}</td>
                <td>{{ registro.consumo_kwh }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="total">
        <p>Total de emisiones: {{ total_emisiones }}</p>
        <p>Planta con mayor consumo: {{ planta_mayor }}</p>
    </div>
</body>
</html>
